<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monitor 7 Mesin Trading</title>
<style>
:root{--bg:#fff;--fg:#1a1d21;--mut:#6b7280;--card:#f4f5f7;--bd:#d9dce1;--ok:#0a7d3b;--bad:#b3261e;--warn:#9a6700;--acc:#2457d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1317;--fg:#e6e8eb;--mut:#98a0ab;--card:#1a2027;--bd:#2c343d;--ok:#4cc38a;--bad:#ff7b72;--warn:#e3b341;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:12px 14px;border-bottom:1px solid var(--bd)}h1{font-size:17px;margin:0}small,.mut{color:var(--mut)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:2}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 10px;border-radius:8px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:12px 14px;max-width:1300px;margin:auto}section{display:none}section.on{display:block}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.card h3{margin:0 0 6px;font-size:14px}.kv{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed var(--bd)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{cursor:pointer;position:sticky;top:0;background:var(--card)}
.tag{padding:1px 7px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}.TP{color:var(--ok)}.SL{color:var(--bad)}.AMBIGUOUS,.INVALID,.EXPIRED{color:var(--warn)}
.banner{padding:10px;border-radius:8px;margin:8px 0;border:1px solid var(--bd);background:var(--card)}.banner.bad{border-color:var(--bad)}.banner.warn{border-color:var(--warn)}
select,input{padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd);margin-right:4px}.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.PENDING,.MENUNGGU,.BERJALAN{color:var(--mut)}.CANCELLED,.TIDAK_TERPAKAI,.TAK_TERNILAI{color:var(--warn)}.TERPAKAI,.AKURAT{color:var(--ok)}.MELESET{color:var(--bad)}.lb td:first-child{font-weight:600}
</style></head><body>
<header><h1>Monitor 7 Mesin Trading</h1><small id="gen">Memuat…</small></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':(v*100).toFixed(1)+'%', n2=v=>v==null?'—':(+v).toFixed(2), px=v=>v==null?'—':(+v).toPrecision(6).replace(/\.?0+$/,'');
const TABS=['Overview','Setup','Jurnal','Engine Comparison','Ticker Analysis','Diagnostics','Data Quality'];
const EXL={TERPAKAI:'Terpakai',TIDAK_TERPAKAI:'Tidak terpakai',MENUNGGU:'Menunggu',BERJALAN:'Berjalan',TAK_TERNILAI:'Tak ternilai'}, ACL={AKURAT:'Akurat (TP)',MELESET:'Meleset (SL)'};
let SF={engine:'',status:'',dir:'',q:''}, JF={engine:'',exec:'',acc:'',ready:'',dir:'',q:''}, SK='engine', SD=1;
let D, scope='independent', basis='source', sortK='analysisUtc', sortDir=-1, F={engine:'',result:'',dir:'',q:''}, PA=null, PB=null;
const EN=()=>D.engineIds, E=()=>D.engines[basis][scope];
const eff=r=>basis==='source'&&r.hasSource?r.resultSrc:r.result;
const effX=r=>basis==='source'&&r.hasSource?r.execSrc:r.exec, effA=r=>basis==='source'&&r.hasSource?r.accSrc:r.acc;
const effR=r=>basis==='source'&&r.hasSource?r.rSrc:r.r;
const stat=(s)=>`<div class="kv"><span>Setup terbit</span><b>${s.published}</b></div><div class="kv"><span>Terpicu</span><b>${s.triggered}</b></div>
<div class="kv"><span>TP / SL</span><b>${s.counts.TP} / ${s.counts.SL}</b></div><div class="kv"><span>Pending / Cancelled / Expired</span><b>${s.counts.PENDING} / ${s.counts.CANCELLED} / ${s.counts.EXPIRED}</b></div>
<div class="kv"><span>Invalid / Ambiguous</span><b>${s.counts.INVALID} / ${s.counts.AMBIGUOUS}</b></div><div class="kv"><span>Win rate (n=${s.resolved})</span><b>${pct(s.winRate)} ${s.winRateCI95?`<small>[${pct(s.winRateCI95[0])}–${pct(s.winRateCI95[1])}]</small>`:''}</b></div>
<div class="kv"><span>Expectancy (R)</span><b>${n2(s.expectancyR)}</b></div><div class="kv"><span>Total R / Max DD (R)</span><b>${n2(s.totalR)} / ${n2(s.maxDrawdownR)}</b></div>`;
const controls=()=>`<div class="bar"><label>Basis hasil: <select onchange="basis=this.value;render()"><option value="source" ${basis=='source'?'selected':''}>Menurut mesin (sama dengan website)</option><option value="candle" ${basis=='candle'?'selected':''}>Verifikasi candle Binance</option></select></label>
<label>Sampel: <select onchange="scope=this.value;render()"><option value="independent" ${scope=='independent'?'selected':''}>Independen (1 per klaster near-duplicate)</option><option value="all" ${scope=='all'?'selected':''}>Semua setup</option></select></label></div>
<div class="banner">${basis=='source'?'<b>Basis "menurut mesin":</b> TP/SL/menunggu persis seperti yang tertampil di jurnal website tiap mesin. Mesin tanpa hasil sendiri (crypto) memakai verifikasi candle.':'<b>Basis "candle":</b> hasil dihitung ulang dari candle Binance (teoretis, tanpa fee/slippage). Bisa berbeda dari website.'}</div>`;
const verdict=(c,a,b)=>({INSUFFICIENT_SAMPLE:`Sampel belum memadai (${a}=${c.nA}, ${b}=${c.nB}, minimum ${c.minSample} per mesin). <b>Belum ada kesimpulan mesin mana yang lebih baik.</b>`,A_BETTER:`${a} unggul secara statistik (CI 95% selisih expectancy > 0).`,B_BETTER:`${b} unggul secara statistik (CI 95% selisih expectancy < 0).`,NO_SIGNIFICANT_DIFFERENCE:'Tidak ada perbedaan yang signifikan secara statistik.'}[c.verdict]);
function table(rows){const cols=[['engine','Mesin'],['analysisWib','Analisis (WIB)'],['ticker','Koin'],['direction','Arah'],['entry','Entry'],['tp','TP'],['sl','SL'],['rr','R'],['reason','Alasan'],['resultSrc','Hasil mesin'],['result','Hasil candle'],['resultWib','Hasil candle (WIB)'],['notes','Catatan']];
 return `<div class="wrap"><table><thead><tr>${cols.map(([k,l])=>`<th onclick="sort('${k}')">${l}${sortK==k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,1500).map(r=>`<tr><td>${esc(r.engine)}</td><td>${esc(r.analysisWib)}</td><td>${esc(r.ticker)}</td><td>${esc(r.direction)}</td><td>${r.entryRange?px(r.entryRange[0])+'–'+px(r.entryRange[1]):px(r.entry)}</td><td>${(r.tp||[]).map(px).join(', ')||'—'}</td><td>${px(r.sl)}</td><td>${n2(r.rr)}</td><td>${esc(r.reason)}</td><td>${r.hasSource?`<span class="tag ${r.resultSrc}">${r.resultSrc}</span> <small class="mut">${esc(r.sourceHasil)}</small>`:'<span class="mut">—</span>'}</td><td><span class="tag ${r.result}">${r.result}</span>${r.isPrimary?'':' <small class="mut" title="near-duplicate">≈dup</small>'}</td><td>${r.resultWib?esc(r.resultWib):'—'}</td><td><small>${esc((r.notes||[]).join(' '))}</small></td></tr>`).join('')||'<tr><td colspan="13" class="mut">Tidak ada data.</td></tr>'}</tbody></table></div>${rows.length>1500?`<p class="mut">Menampilkan 1500 dari ${rows.length} baris.</p>`:''}`}
function filtered(base){const q=F.q.toLowerCase();let r=base.filter(x=>(!F.engine||x.engine==F.engine)&&(!F.result||eff(x)==F.result)&&(!F.dir||x.direction==F.dir)&&(!q||(x.ticker||'').toLowerCase().includes(q)));
 return r.sort((a,b)=>((a[sortK]??'')>(b[sortK]??'')?1:-1)*sortDir)}
const filters=()=>`<div class="bar"><select onchange="F.engine=this.value;render()"><option value="">Semua mesin</option>${EN().map(e=>`<option ${F.engine==e?'selected':''}>${e}</option>`).join('')}</select>
<select onchange="F.result=this.value;render()"><option value="">Semua hasil (basis aktif)</option>${['PENDING','TP','SL','CANCELLED','EXPIRED','INVALID','AMBIGUOUS'].map(s=>`<option ${F.result==s?'selected':''}>${s}</option>`).join('')}</select>
<select onchange="F.dir=this.value;render()"><option value="">Arah</option><option ${F.dir=='LONG'?'selected':''}>LONG</option><option ${F.dir=='SHORT'?'selected':''}>SHORT</option></select><input placeholder="Cari koin" value="${esc(F.q)}" onchange="F.q=this.value;render()"></div>`;
const runStat=()=>D.diagnostics.lastRun?.engines||{};
function engineBanners(){const r=D.diagnostics.lastRun;if(!r)return '<div class="banner warn">Belum ada run scraper.</div>';
 const out=Object.entries(runStat()).map(([k,e])=>{const m={FETCH_FAILED:['bad','gagal mengambil data ('+esc((e.errors||[]).join('; '))+'). Ini BUKAN berarti tidak ada setup.'],NEEDS_SELECTOR_VERIFICATION:['warn','tabel/selector belum terverifikasi. Jalankan workflow Discover untuk mesin ini.'],ZERO_CARDS_UNCONFIRMED:['warn','0 baris terbaca tetapi "kosong" belum terkonfirmasi (bisa selector salah).'],NO_SETUPS:['','scan berhasil, tidak ada setup.']}[e.emptyKind];return m?`<div class="banner ${m[0]}"><b>${k}:</b> ${m[1]}</div>`:''}).join('');
 return out+(r.fatal?`<div class="banner bad">${esc(r.fatal)}</div>`:'')}
const statusPill=(e)=>{if(!e)return '<span class="pill">belum ada run</span>';const k=e.status==='OK'||e.status==='OK_NO_SETUPS'?'ok':e.status==='FAILED'?'bad':'warn';return `<span class="pill ${k}">${e.status}</span>`};
const V={
Overview(){const e=E();return `${engineBanners()}${controls()}
<div class="wrap"><table class="lb" style="min-width:760px"><thead><tr><th>Mesin</th><th>Status scan terakhir</th><th>Setup</th><th>Terpicu</th><th>TP</th><th>SL</th><th>Pending</th><th>Expired</th><th>Win rate</th><th>Exp R</th><th>Total R</th></tr></thead><tbody>${EN().map(k=>{const s=e[k].summary,st=runStat()[k];return `<tr><td>${k}</td><td>${statusPill(st)}${st&&st.journal?`<small class="mut">jurnal ${st.journal.domRows} baris tabel / ${st.journal.jsonRows} JSON</small>`:''}</td><td>${s.published}</td><td>${s.triggered}</td><td>${s.counts.TP}</td><td>${s.counts.SL}</td><td>${s.counts.PENDING}</td><td>${s.counts.EXPIRED}</td><td>${pct(s.winRate)}</td><td>${n2(s.expectancyR)}</td><td>${n2(s.totalR)}</td></tr>`}).join('')}</tbody></table></div>
<h3>Rincian per mesin</h3><div class="grid">${EN().map(k=>`<div class="card"><h3>${k}</h3>${stat(e[k].summary)}</div>`).join('')}</div>`},
Setup(){const L=D.live,ids=EN(),f=SF,q=f.q.toLowerCase();
 const all=ids.flatMap(e=>(L.engines[e]?.items||[]));
 const rows=all.filter(x=>(!f.engine||x.engine==f.engine)&&(!f.status||(x.cardStatus||'').toUpperCase()==f.status)&&(!f.dir||x.direction==f.dir)&&(!q||(x.ticker||'').toLowerCase().includes(q))).sort((a,b)=>((a[SK]??'')>(b[SK]??'')?1:-1)*SD);
 const stats=[...new Set(all.map(x=>(x.cardStatus||'').toUpperCase()).filter(Boolean))].sort();
 const th=(k,l)=>`<th onclick="sortS('${k}')">${l}${SK==k?(SD>0?' ▲':' ▼'):''}</th>`;
 const card=e=>{const x=L.engines[e];if(!x||!x.tracked)return `<div class="card"><h3>${e}</h3><span class="pill">belum ada data setup</span></div>`;
  return `<div class="card"><h3>${e} <span class="pill ${x.stale?'warn':'ok'}">${x.stale?'tidak terkonfirmasi (data lama)':'terkini'}</span></h3><div class="kv"><span>Siap dieksekusi</span><b>${x.count}</b></div><div class="kv"><span>Ditolak filter mesin</span><b>${x.rejected??'—'}</b></div><div class="kv"><span>Scan (WIB)</span><b>${esc(x.scanWib)}</b></div>${x.stale?`<small class="mut">Percobaan terakhir ${esc(x.lastAttemptWib)} (${esc(x.scanStatus)}); daftar di bawah dari scan terkonfirmasi terakhir.</small>`:''}</div>`};
 return `${engineBanners()}<div class="banner"><b>Setup</b> = analisis yang <b>siap dieksekusi</b> saat ini, yaitu yang lolos filter masing-masing mesin (diambil dari kartu pada halaman mesin). Ini daftar kondisi terakhir, bukan riwayat; riwayat lengkap dan hasilnya ada di tab <b>Jurnal</b>. Data: <code>data/setup.json</code>. Diperbarui ${esc(L.updatedWib)} WIB.</div>
 <div class="grid">${ids.map(card).join('')}</div>
 <div class="bar"><select onchange="SF.engine=this.value;render()"><option value="">Semua mesin</option>${ids.map(e=>`<option ${SF.engine==e?'selected':''}>${e}</option>`).join('')}</select>
 <select onchange="SF.status=this.value;render()"><option value="">Semua status kartu</option>${stats.map(t=>`<option ${SF.status==t?'selected':''}>${t}</option>`).join('')}</select>
 <select onchange="SF.dir=this.value;render()"><option value="">Arah</option><option ${SF.dir=='LONG'?'selected':''}>LONG</option><option ${SF.dir=='SHORT'?'selected':''}>SHORT</option></select><input placeholder="Cari koin" value="${esc(SF.q)}" onchange="SF.q=this.value;render()"></div>
 <p class="mut">${rows.length} setup siap dari ${all.length} total.</p>
 <div class="wrap"><table><thead><tr>${th('engine','Mesin')}${th('ticker','Koin')}${th('direction','Arah')}${th('cardStatus','Status kartu')}${th('entry','Entry')}<th>TP</th>${th('sl','SL')}${th('rr','R:R')}${th('riskUsd','Risiko $')}${th('qty','Qty')}${th('price','Harga kini')}${th('distToEntryPct','Jarak ke entry %')}<th>Alasan / konfirmasi</th>${th('firstSeenWib','Pertama siap (WIB)')}${th('lastSeenWib','Terakhir terlihat (WIB)')}<th>Di Jurnal</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.engine)}</td><td><b>${esc(r.ticker)}</b></td><td>${esc(r.direction)}</td><td>${esc(r.cardStatus)}</td><td>${r.entryRange?px(r.entryRange[0])+'–'+px(r.entryRange[1]):px(r.entry)}</td><td>${(r.tp||[]).map(px).join(', ')||'—'}</td><td>${px(r.sl)}</td><td>${n2(r.rr)}</td><td>${n2(r.riskUsd)}</td><td>${px(r.qty)}</td><td>${px(r.price)}</td><td>${n2(r.distToEntryPct)}</td><td><small>${esc([r.reason,r.confirmation].filter(Boolean).join(' · '))}</small></td><td>${esc(r.firstSeenWib)}</td><td>${esc(r.lastSeenWib)}</td><td>${r.inJurnal?`<span class="tag ${r.jResultSrc||''}">${esc(r.jResultSrc||'ada')}</span> <small class="mut">${esc(r.jurnalWib)}</small>`:'<span class="mut" title="belum muncul di jurnal mesin">belum</span>'}</td></tr>`).join('')||'<tr><td colspan="16" class="mut">Tidak ada setup yang siap dieksekusi.</td></tr>'}</tbody></table></div>`},
Jurnal(){const ids=EN(),js=D.jurnalStats[basis],q=JF.q.toLowerCase();
 const rows=D.jurnal.filter(x=>(!JF.engine||x.engine==JF.engine)&&(!JF.exec||effX(x)==JF.exec)&&(!JF.acc||effA(x)==JF.acc)&&(!JF.ready||(JF.ready=='ya')==x.readyEver)&&(!JF.dir||x.direction==JF.dir)&&(!q||(x.ticker||'').toLowerCase().includes(q))).sort((a,b)=>((a[sortK]??'')>(b[sortK]??'')?1:-1)*sortDir);
 const sc=(t,s)=>`<tr><td>${t}</td><td>${s.generated}</td><td>${s.terpakai}</td><td>${s.tidakTerpakai}</td><td>${s.menunggu+s.berjalan}</td><td>${s.takTernilai}</td><td class="TP">${s.tp}</td><td class="SL">${s.sl}</td><td><b>${pct(s.akurasi)}</b></td><td>${pct(s.tingkatEksekusi)}</td></tr>`;
 const sel=(k,l,opts)=>`<select onchange="JF.${k}=this.value;render()"><option value="">${l}</option>${opts.map(([v,t])=>`<option value="${v}" ${JF[k]==v?'selected':''}>${t}</option>`).join('')}</select>`;
 const cols=[['engine','Mesin'],['analysisWib','Analisis (WIB)'],['ticker','Koin'],['direction','Arah'],['entry','Entry'],['tp','TP'],['sl','SL'],['rr','R'],['readyEver','Pernah di Setup'],['execSrc','Terpakai?'],['accSrc','Akurat?'],['resultSrc','Hasil mesin'],['result','Hasil candle'],['resultWib','Hasil candle (WIB)'],['reason','Alasan']];
 return `${engineBanners()}<div class="banner"><b>Jurnal</b> = riwayat lengkap semua setup yang pernah dihasilkan tiap mesin (${D.counts.jurnal} baris), dicatat terpisah dari tab Setup (<code>data/jurnal.json</code>). <b>Terpakai</b> = entry tersentuh sehingga trade benar-benar terjadi (hasil TP atau SL); <b>tidak terpakai</b> = kedaluwarsa / tidak terisi / batal. <b>Akurat</b> = TP, <b>meleset</b> = SL, dihitung hanya dari yang terpakai. <b>Pernah di Setup</b> = analisis ini pernah terlihat lolos filter di tab Setup (hanya tercatat sejak pelacakan dimulai, jadi bisa terlewat bila muncul-hilang di antara dua scan).</div>
 <div class="bar"><label>Basis hasil: <select onchange="basis=this.value;render()"><option value="source" ${basis=='source'?'selected':''}>Menurut mesin (sama dengan website)</option><option value="candle" ${basis=='candle'?'selected':''}>Verifikasi candle Binance</option></select></label></div>
 <h3>Rekap per mesin</h3><div class="wrap"><table class="lb" style="min-width:760px"><thead><tr><th>Mesin</th><th>Dihasilkan</th><th>Terpakai</th><th>Tidak terpakai</th><th>Menunggu / berjalan</th><th>Tak ternilai</th><th>Akurat (TP)</th><th>Meleset (SL)</th><th>Akurasi (TP ÷ terpakai)</th><th>Tingkat eksekusi*</th></tr></thead><tbody>${ids.map(e=>sc(e,js[e].semua)).join('')}</tbody></table></div><small class="mut">*Terpakai ÷ (terpakai + tidak terpakai), hanya dari setup yang sudah final.</small>
 <h3>Hanya yang pernah tampil di tab Setup (lolos filter mesin)</h3><div class="wrap"><table class="lb" style="min-width:760px"><thead><tr><th>Mesin</th><th>Dihasilkan</th><th>Terpakai</th><th>Tidak terpakai</th><th>Menunggu / berjalan</th><th>Tak ternilai</th><th>Akurat (TP)</th><th>Meleset (SL)</th><th>Akurasi</th><th>Tingkat eksekusi*</th></tr></thead><tbody>${ids.map(e=>sc(e,js[e].pernahSetup)).join('')}</tbody></table></div>
 <h3>Riwayat lengkap</h3><div class="bar">${sel('engine','Semua mesin',ids.map(e=>[e,e]))}${sel('exec','Semua status terpakai',Object.entries(EXL))}${sel('acc','Akurat / meleset',Object.entries(ACL))}${sel('ready','Pernah di Setup?',[['ya','Ya'],['tidak','Tidak']])}${sel('dir','Arah',[['LONG','LONG'],['SHORT','SHORT']])}<input placeholder="Cari koin" value="${esc(JF.q)}" onchange="JF.q=this.value;render()"></div>
 <p class="mut">${rows.length} dari ${D.jurnal.length} baris.</p>
 <div class="wrap"><table><thead><tr>${cols.map(([k,l])=>`<th onclick="sort('${k}')">${l}${sortK==k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,1500).map(r=>{const x=effX(r),a=effA(r);return `<tr><td>${esc(r.engine)}</td><td>${esc(r.analysisWib)}</td><td><b>${esc(r.ticker)}</b></td><td>${esc(r.direction)}</td><td>${r.entryRange?px(r.entryRange[0])+'–'+px(r.entryRange[1]):px(r.entry)}</td><td>${(r.tp||[]).map(px).join(', ')||'—'}</td><td>${px(r.sl)}</td><td>${n2(r.rr)}</td><td>${r.readyEver?`<span class="pill ok" title="pertama siap ${esc(r.readyFirstWib)} WIB">ya</span>`:'<span class="mut">tidak</span>'}</td><td><span class="tag ${x}">${EXL[x]||x}</span></td><td>${a?`<span class="tag ${a}">${ACL[a]}</span>`:'<span class="mut">—</span>'}</td><td>${r.hasSource?`<span class="tag ${r.resultSrc}">${r.resultSrc}</span> <small class="mut">${esc(r.sourceHasil)}</small>`:'<span class="mut">—</span>'}</td><td><span class="tag ${r.result}">${r.result}</span>${r.isPrimary?'':' <small class="mut" title="near-duplicate">≈dup</small>'}</td><td>${r.resultWib?esc(r.resultWib):'—'}</td><td><small>${esc(r.reason)}</small></td></tr>`}).join('')||'<tr><td colspan="15" class="mut">Tidak ada data.</td></tr>'}</tbody></table></div>${rows.length>1500?`<p class="mut">Menampilkan 1500 dari ${rows.length} baris.</p>`:''}`},
'Engine Comparison'(){const ids=EN();PA=PA||ids.find(x=>x==='tnv2')||ids[0];PB=PB||ids.find(x=>x==='tn')||ids[1];
 const key=ids.indexOf(PA)<ids.indexOf(PB)?`${PA}|${PB}`:`${PB}|${PA}`;let c=D.comparison[basis][scope][key]; const swapped=ids.indexOf(PA)>ids.indexOf(PB);
 const e=E(),sel=(v,f)=>`<select onchange="${f}=this.value;render()">${ids.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
 const cc=c&&PA!==PB?(swapped?{...c,nA:c.nB,nB:c.nA,expectancyA:c.expectancyB,expectancyB:c.expectancyA,diff:c.diff==null?null:-c.diff,ci95:c.ci95?[-c.ci95[1],-c.ci95[0]]:null,verdict:{A_BETTER:'B_BETTER',B_BETTER:'A_BETTER'}[c.verdict]||c.verdict}:c):null;
 const pairs=(D.pairs[key]||[]).slice().reverse().slice(0,60);const [pa,pb]=key.split('|');
 const grp=(t,k)=>`<div class="card"><h3>${t}</h3>${[PA,PB].map(m=>{const g=Object.entries(e[m][k]);return `<b>${m}</b><div class="wrap"><table style="min-width:0"><tr><th>Grup</th><th>n</th><th>Win</th><th>Exp R</th><th>Total R</th></tr>${g.map(([n,s])=>`<tr><td>${esc(n)}</td><td>${s.resolved}</td><td>${pct(s.winRate)}</td><td>${n2(s.expectancyR)}</td><td>${n2(s.totalR)}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">—</td></tr>'}</table></div>`}).join('')}</div>`;
 return `${controls()}<div class="bar"><label>Mesin A: ${sel(PA,'PA')}</label><label>Mesin B: ${sel(PB,'PB')}</label></div>
 ${cc?`<div class="banner ${cc.verdict=='INSUFFICIENT_SAMPLE'?'warn':''}">${verdict(cc,PA,PB)}<br><small>Expectancy ${PA}: ${n2(cc.expectancyA)} · ${PB}: ${n2(cc.expectancyB)} · selisih: ${n2(cc.diff)} ${cc.ci95?`· CI95% [${n2(cc.ci95[0])}, ${n2(cc.ci95[1])}]`:''}<br>${esc(cc.caveat)}</small></div>`:'<div class="banner warn">Pilih dua mesin berbeda.</div>'}
 <div class="grid">${[PA,PB].map(k=>`<div class="card"><h3>${k}</h3>${stat(e[k].summary)}</div>`).join('')}</div>
 <h3>Per arah, timeframe, alasan entry</h3><div class="grid">${grp('Arah','byDirection')}${grp('Timeframe','byTimeframe')}${grp('Alasan entry','byReason')}</div>
 <h3>Per periode (tanggal hasil, WIB)</h3><div class="grid">${['daily','weekly','monthly'].map(p=>`<div class="card"><h3>${p}</h3>${[PA,PB].map(m=>`<b>${m}</b><div class="wrap"><table style="min-width:0"><tr><th>Periode</th><th>TP</th><th>SL</th><th>Total R</th></tr>${e[m][p].slice(-10).map(x=>`<tr><td>${x.period}</td><td>${x.tp}</td><td>${x.sl}</td><td>${n2(x.totalR)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">—</td></tr>'}</table></div>`).join('')}</div>`).join('')}</div>
 <h3>Pasangan setup lintas mesin (simbol sama, waktu berdekatan; hasil menurut mesin bila ada)</h3><div class="wrap"><table><tr><th>Koin</th><th>Selisih (mnt)</th><th>Relasi</th><th>${pa}</th><th>${pb}</th><th>Δ entry</th></tr>${pairs.map(p=>`<tr><td>${p.symbol}</td><td>${n2(p.minutesApart)}</td><td>${p.relation}</td><td>${p.a.direction} ${px(p.a.entry)} → ${p.a.result}</td><td>${p.b.direction} ${px(p.b.entry)} → ${p.b.result}</td><td>${pct(p.entryDiffPct)}</td></tr>`).join('')||'<tr><td colspan=6 class="mut">Belum ada pasangan.</td></tr>'}</table></div>`},
'Ticker Analysis'(){const e=E(),ids=EN().filter(m=>Object.keys(e[m].byTicker).length),ks=[...new Set(ids.flatMap(m=>Object.keys(e[m].byTicker)))].sort();
 return `${controls()}<div class="wrap"><table><tr><th>Koin</th>${ids.map(m=>`<th>${m}: n / win / Exp R / Total R</th>`).join('')}</tr>${ks.map(k=>`<tr><td>${esc(k)}</td>${ids.map(m=>{const s=e[m].byTicker[k];return `<td>${s?`${s.resolved} / ${pct(s.winRate)} / ${n2(s.expectancyR)} / ${n2(s.totalR)}`:'—'}</td>`}).join('')}</tr>`).join('')||'<tr><td class="mut">Belum ada data.</td></tr>'}</table></div>`},
Diagnostics(){const r=D.diagnostics.runs.slice().reverse();const live=(e)=>e.live?`${e.live.passed} lolos / ${e.live.rejected} ditolak dari ${e.live.cards} kartu`+(e.setup?` · Setup siap: ${e.setup.count}${e.setup.stale?' (lama)':''}`:''):(e.setup?`Setup siap: ${e.setup.count}${e.setup.stale?' (lama)':''}`:'—');
 return `${engineBanners()}<div class="wrap"><table><tr><th>Waktu run (WIB)</th><th>Mesin</th><th>Status</th><th>Baris/kartu</th><th>Baru</th><th>Jurnal (tabel / JSON / ditimpa tabel)</th><th>Kartu setup (gerbang)</th><th>Error</th><th>Warning</th></tr>${r.flatMap(x=>Object.entries(x.engines||{}).map(([k,e])=>`<tr><td>${toW(x.runAtUtc)}</td><td>${k}</td><td>${e.status}${e.emptyKind?` (${e.emptyKind})`:''}</td><td>${e.cards}</td><td>${e.added}</td><td>${e.journal?`${e.journal.domRows} / ${e.journal.jsonRows} / ${e.journal.hasilOverridden}`:'—'}</td><td><small>${live(e)}</small></td><td><small>${esc((e.errors||[]).join('; '))}</small></td><td><small>${esc((e.warnings||[]).join('; '))}</small></td></tr>`)).join('')||'<tr><td colspan=9 class="mut">Belum ada run.</td></tr>'}</table></div><p class="mut">Evaluasi candle run terakhir: ${esc(JSON.stringify(D.diagnostics.lastRun?.evaluation))}</p>`},
'Data Quality'(){const q=D.quality,sec=(t,a)=>`<h3>${t} (${a.length})</h3>${a.length?table(a):'<p class="mut">Tidak ada.</p>'}`;
 return sec('Hasil mesin ≠ hasil candle (TP vs SL berlawanan)',q.sourceDisagreements)+sec('Invalid',q.invalid)+sec('Ambiguous',q.ambiguous)+sec('Belum terverifikasi (error data harga)',q.unverified)+sec('Peringatan parsing',q.withWarnings)+sec('Near-duplicate (tidak masuk sampel independen)',q.nearDuplicates)+`<h3>Konflik arah lintas mesin (${q.conflicts.length})</h3>`+(q.conflicts.length?`<ul>${q.conflicts.map(p=>`<li>${p.symbol}: ${p.engines[0]} ${p.a} vs ${p.engines[1]} ${p.b}</li>`).join('')}</ul>`:'<p class="mut">Tidak ada.</p>')}};
const toW=s=>{const d=new Date(Date.parse(s)+7*36e5);return d.toISOString().slice(0,16).replace('T',' ')};
let tab=decodeURIComponent(location.hash.slice(1))||TABS[0];if(!TABS.includes(tab))tab=TABS[0];
function sort(k){sortDir=sortK==k?-sortDir:1;sortK=k;render()}
function sortS(k){SD=SK==k?-SD:1;SK=k;render()}
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';location.hash=tab;render()">${t}</button>`).join('');$('#main').innerHTML=`<section class="on">${V[tab]()}</section>`}
fetch('data/dashboard.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{D=d;$('#gen').textContent=`Diperbarui ${d.generatedAtWib} WIB · ${d.engineIds.length} mesin · sumber harga: ${d.methodology.source}`;render()}).catch(e=>{$('#main').innerHTML=`<div class="banner bad">Gagal memuat data/dashboard.json: ${esc(e.message)}</div>`});
</script></body></html>
