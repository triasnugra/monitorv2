name: Collect, evaluate, deploy
on:
  schedule: [{ cron: '*/30 * * * *' }]   # best-effort: GitHub dapat menunda/melewati run terjadwal
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: benchmark          # mencegah dua run bersamaan (konflik commit)
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Collect + evaluate + build
        timeout-minutes: 30          # kegagalan menggantung terlihat jelas, bukan menghabiskan seluruh job
        run: node src/index.js all
      - name: Commit data (retry saat konflik)
        run: |
          git config user.name "benchmark-bot"; git config user.email "bot@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && exit 0
          git commit -m "data: update $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i*5)); done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
